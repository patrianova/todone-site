<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-did</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1A19; --accent:#FF2E77; --muted:#9A9A94; --done:#C4C4BF;
          --divider:#E3E3DF; --hairline:#F4F4F2; --canvas:#FFFFFF; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:Manrope,system-ui,sans-serif; background:var(--canvas); color:var(--ink);
         max-width:560px; margin:0 auto; padding:18px 24px 90px; }
  header { display:flex; align-items:center; gap:10px; padding:6px 0 14px; }
  .mark { width:28px; height:28px; border-radius:8px; background:var(--accent);
          display:flex; align-items:center; justify-content:center; }
  .word { font-size:22px; font-weight:600; letter-spacing:-.03em; }
  .word em { color:var(--accent); font-style:italic; font-weight:600; }
  header .spacer { flex:1; }
  #whoami { font-size:12px; color:var(--muted); }
  h2.bucket { font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
              color:var(--muted); margin:22px 0 4px; display:flex; gap:7px; }
  h2.bucket span { color:var(--done); }
  .task { display:flex; gap:14px; align-items:flex-start; padding:13px 0;
          border-bottom:1px solid var(--divider); }
  .task:last-child { border-bottom:none; }
  .check { width:22px; height:22px; border-radius:50%; border:1.5px solid #DCDCD8; flex:none;
           margin-top:1px; cursor:pointer; background:none; position:relative; }
  .task.done .check { background:var(--accent); border-color:var(--accent); }
  .task.done .check::after { content:"✓"; color:#fff; font-size:12px; font-weight:800;
           position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .body { flex:1; }
  .title { font-size:16px; line-height:1.4; }
  .task.done .title { color:var(--done); text-decoration:line-through; }
  .due { font-size:13px; color:var(--muted); margin-top:3px; }
  .due.overdue { color:var(--accent); }
  .del { border:none; background:none; color:var(--done); cursor:pointer; font-size:15px;
         padding:2px 4px; visibility:hidden; }
  .task:hover .del { visibility:visible; }
  form#add { position:fixed; bottom:0; left:0; right:0; background:var(--canvas);
             border-top:1px solid var(--hairline); padding:12px 24px 20px; }
  form#add .row { max-width:512px; margin:0 auto; display:flex; gap:10px; }
  #newTitle { flex:1; border:none; background:var(--hairline); border-radius:100px;
              padding:14px 20px; font:inherit; font-size:15px; outline:none; }
  #newDue { border:none; background:var(--hairline); border-radius:14px; padding:8px 10px;
            font:inherit; font-size:13px; color:var(--muted); width:150px; }
  #addBtn { width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff;
            border:none; font-size:22px; cursor:pointer; flex:none; }
  .gate { text-align:center; padding:70px 20px; }
  .gate p { color:var(--muted); font-size:15px; line-height:1.6; margin:14px 0 22px; }
  .hidden { display:none !important; }
  #status { font-size:13px; color:var(--muted); padding:8px 0; }
  code { background:var(--hairline); padding:2px 6px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="mark"><svg width="18" height="18" viewBox="0 0 64 64" fill="none"><defs><mask id="m"><path d="M11 35 L25 49 L53 15" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask></defs><g mask="url(#m)" fill="#fff"><rect x="4" width="5.5" height="64"/><rect x="12" width="5.5" height="64"/><rect x="20" width="5.5" height="64"/><rect x="28" width="5.5" height="64"/><rect x="36" width="5.5" height="64"/><rect x="44" width="5.5" height="64"/><rect x="52" width="5.5" height="64"/></g></svg></div>
  <div class="word">To - <em>did</em></div>
  <div class="spacer"></div>
  <div id="whoami"></div>
</header>

<div id="setup" class="gate hidden">
  <p>This page needs its CloudKit token.<br>
  CloudKit Console → <b>iCloud.app.todid</b> → Settings → <b>Tokens &amp; Keys</b> →
  API Tokens → create <code>todone-web</code>, paste it into <code>app/config.js</code>.</p>
</div>

<div id="signin" class="gate hidden">
  <p>Your list lives in your iCloud.<br>Sign in with your Apple ID to see it.</p>
  <div id="apple-sign-in-button"></div>
</div>

<div id="list" class="hidden">
  <div id="status"></div>
  <div id="buckets"></div>
</div>

<form id="add" class="hidden">
  <div class="row">
    <input id="newTitle" placeholder="Add a task…" autocomplete="off">
    <input id="newDue" type="datetime-local">
    <button id="addBtn" type="submit">＋</button>
  </div>
</form>

<script src="./config.js"></script>
<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script>
const ZONE = { zoneName: "com.apple.coredata.cloudkit.zone" };
let db, records = [];

function show(id) {
  for (const s of ["setup","signin","list"]) document.getElementById(s).classList.toggle("hidden", s!==id);
  document.getElementById("add").classList.toggle("hidden", id!=="list");
}

function bucketOf(r) {
  const due = r.fields.CD_dueAt && r.fields.CD_dueAt.value;
  if (!due) return "No date";
  const d = new Date(due), now = new Date();
  if (d < now) return "Overdue";
  const today = new Date(now); today.setHours(0,0,0,0);
  const days = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - today)/86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Tomorrow";
  if (days <= 7) return "This week";
  return "Later";
}

function dueLabel(r) {
  const due = r.fields.CD_dueAt && r.fields.CD_dueAt.value;
  if (!due) return "";
  return new Date(due).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric",
                                                  hour:"numeric", minute:"2-digit"});
}

function render() {
  const open = records.filter(r => !(r.fields.CD_completedAt && r.fields.CD_completedAt.value));
  const done = records.filter(r =>  (r.fields.CD_completedAt && r.fields.CD_completedAt.value));
  const order = ["Overdue","Today","Tomorrow","This week","Later","No date"];
  const groups = {};
  for (const r of open) (groups[bucketOf(r)] ??= []).push(r);
  const host = document.getElementById("buckets"); host.innerHTML = "";
  const section = (name, items, isDone) => {
    if (!items || !items.length) return;
    const h = document.createElement("h2"); h.className = "bucket";
    h.innerHTML = `${name} <span>${items.length}</span>`; host.appendChild(h);
    for (const r of items) host.appendChild(row(r, isDone));
  };
  for (const b of order) section(b, (groups[b]||[]).sort((a,c)=>(a.fields.CD_dueAt?.value??9e15)-(c.fields.CD_dueAt?.value??9e15)));
  section("Done", done.sort((a,c)=>(c.fields.CD_completedAt.value)-(a.fields.CD_completedAt.value)));
  document.getElementById("status").textContent = open.length ? "" : "Nothing to do 🎉";
}

function row(r, isDone) {
  const el = document.createElement("div");
  const completed = r.fields.CD_completedAt && r.fields.CD_completedAt.value;
  el.className = "task" + (completed ? " done" : "");
  const due = dueLabel(r);
  const overdue = r.fields.CD_dueAt?.value && r.fields.CD_dueAt.value < Date.now() && !completed;
  el.innerHTML = `<button class="check" title="${completed?"Reopen":"Complete"}"></button>
    <div class="body"><div class="title"></div>
    ${due && !completed ? `<div class="due ${overdue?"overdue":""}">${due}</div>` : ""}</div>
    <button class="del" title="Delete">🗑</button>`;
  el.querySelector(".title").textContent = r.fields.CD_title?.value ?? "(untitled)";
  el.querySelector(".check").onclick = () => toggle(r, !completed);
  el.querySelector(".del").onclick = () => del(r);
  return el;
}

async function refresh() {
  document.getElementById("status").textContent = "Loading…";
  records = [];
  let resp = await db.performQuery({
    recordType: "CD_TodoTask",
    filterBy: [{fieldName:"CD_entityName", comparator:"EQUALS", fieldValue:{value:"TodoTask"}}],
  }, { zoneID: ZONE, resultsLimit: 200 });
  while (true) {
    if (resp.hasErrors) { document.getElementById("status").textContent = "Load failed: " + resp.errors[0].reason; return; }
    records.push(...resp.records);
    if (!resp.moreComing) break;
    resp = await db.performQuery(resp);
  }
  render();
}

async function toggle(r, complete) {
  const rec = { recordName: r.recordName, recordChangeTag: r.recordChangeTag,
                recordType: "CD_TodoTask",
                fields: { CD_completedAt: { value: complete ? Date.now() : null } } };
  const resp = await db.saveRecords([rec], { zoneID: ZONE });
  if (!resp.hasErrors) refresh(); else alert(resp.errors[0].reason);
}

async function del(r) {
  if (!confirm(`Delete “${r.fields.CD_title?.value}”?`)) return;
  const resp = await db.deleteRecords([{recordName: r.recordName}], { zoneID: ZONE });
  if (!resp.hasErrors) refresh(); else alert(resp.errors[0].reason);
}

document.getElementById("add").addEventListener("submit", async e => {
  e.preventDefault();
  const title = document.getElementById("newTitle").value.trim();
  if (!title) return;
  const dueRaw = document.getElementById("newDue").value;
  const fields = {
    CD_title: { value: title },
    CD_id: { value: crypto.randomUUID().toUpperCase() },
    CD_entityName: { value: "TodoTask" },
    CD_createdAt: { value: Date.now() },
  };
  if (dueRaw) fields.CD_dueAt = { value: new Date(dueRaw).getTime() };
  const resp = await db.saveRecords([{ recordType: "CD_TodoTask", zoneID: ZONE, fields }]);
  if (resp.hasErrors) { alert(resp.errors[0].reason); return; }
  document.getElementById("newTitle").value = ""; document.getElementById("newDue").value = "";
  refresh();
});

(function boot() {
  if (!window.TODID_CK_TOKEN) { show("setup"); return; }
  CloudKit.configure({ containers: [{
    containerIdentifier: "iCloud.app.todid",
    apiTokenAuth: { apiToken: window.TODID_CK_TOKEN, persist: true },
    environment: "production",
  }]});
  const container = CloudKit.getDefaultContainer();
  db = container.privateCloudDatabase;
  container.setUpAuth().then(identity => {
    if (identity) { onSignedIn(container, identity); } else { show("signin"); container.whenUserSignsIn().then(id => onSignedIn(container, id)); }
  });
})();

function onSignedIn(container, identity) {
  document.getElementById("whoami").textContent = identity.nameComponents
    ? `${identity.nameComponents.givenName ?? ""}` : "signed in";
  show("list"); refresh();
  container.whenUserSignsOut().then(() => location.reload());
}
</script>
</body>
</html>
