<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-did</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1A19; --accent:#FF2E77; --muted:#9A9A94; --done:#C4C4BF;
          --divider:#E3E3DF; --hairline:#F4F4F2; --canvas:#FFFFFF; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:Manrope,system-ui,sans-serif; background:var(--canvas); color:var(--ink);
         max-width:560px; margin:0 auto; padding:18px 24px 90px; }
  header { display:flex; align-items:center; gap:10px; padding:6px 0 14px; }
  .mark { width:28px; height:28px; border-radius:8px; background:var(--accent);
          display:flex; align-items:center; justify-content:center; }
  .word { font-size:22px; font-weight:600; letter-spacing:-.03em; }
  .word em { color:var(--accent); font-style:italic; font-weight:600; }
  header .spacer { flex:1; }
  #whoami { font-size:12px; color:var(--muted); }
  h2.bucket { font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
              color:var(--muted); margin:22px 0 4px; display:flex; gap:7px; }
  h2.bucket span { color:var(--done); }
  .task { display:flex; gap:14px; align-items:flex-start; padding:13px 0;
          border-bottom:1px solid var(--divider); }
  .task:last-child { border-bottom:none; }
  .check { width:22px; height:22px; border-radius:50%; border:1.5px solid #DCDCD8; flex:none;
           margin-top:1px; cursor:pointer; background:none; position:relative; }
  .task.done .check { background:var(--accent); border-color:var(--accent); }
  .task.done .check::after { content:"✓"; color:#fff; font-size:12px; font-weight:800;
           position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .body { flex:1; }
  .title { font-size:16px; line-height:1.4; }
  .task.done .title { color:var(--done); text-decoration:line-through; }
  .due { font-size:13px; color:var(--muted); margin-top:3px; }
  .due.overdue { color:var(--accent); }
  .del { border:none; background:none; color:var(--done); cursor:pointer; font-size:15px;
         padding:2px 4px; visibility:hidden; }
  .task:hover .del { visibility:visible; }
  form#add { position:fixed; bottom:0; left:0; right:0; background:var(--canvas);
             border-top:1px solid var(--hairline); padding:12px 24px 20px; }
  form#add .row { max-width:512px; margin:0 auto; display:flex; gap:10px; }
  #newTitle { flex:1; border:none; background:var(--hairline); border-radius:100px;
              padding:14px 20px; font:inherit; font-size:15px; outline:none; }
  #newDue { border:none; background:var(--hairline); border-radius:14px; padding:8px 10px;
            font:inherit; font-size:13px; color:var(--muted); width:150px; }
  #addBtn { width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff;
            border:none; font-size:22px; cursor:pointer; flex:none; }
  .gate { text-align:center; padding:70px 20px; }
  .gate p { color:var(--muted); font-size:15px; line-height:1.6; margin:14px 0 22px; }
  .hidden { display:none !important; }
  #status { font-size:13px; color:var(--muted); padding:8px 0; }
  code { background:var(--hairline); padding:2px 6px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="mark"><svg width="18" height="18" viewBox="0 0 64 64" fill="none"><defs><mask id="m"><path d="M11 35 L25 49 L53 15" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask></defs><g mask="url(#m)" fill="#fff"><rect x="4" width="5.5" height="64"/><rect x="12" width="5.5" height="64"/><rect x="20" width="5.5" height="64"/><rect x="28" width="5.5" height="64"/><rect x="36" width="5.5" height="64"/><rect x="44" width="5.5" height="64"/><rect x="52" width="5.5" height="64"/></g></svg></div>
  <div class="word">To - <em>did</em></div>
  <div class="spacer"></div>
  <div id="whoami"></div>
  <button id="signout" class="hidden" title="Sign out" style="border:none;background:none;color:var(--done);cursor:pointer;font:inherit;font-size:13px;">Sign out</button>
</header>

<div id="setup" class="gate hidden">
  <p>This page needs its CloudKit token.<br>
  CloudKit Console → <b>iCloud.app.todid</b> → Settings → <b>Tokens &amp; Keys</b> →
  API Tokens → create <code>todone-web</code>, paste it into <code>app/config.js</code>.</p>
</div>

<div id="signin" class="gate hidden">
  <p>Your list lives in your iCloud.<br>Sign in with your Apple ID to see it.</p>
  <button id="signinBtn" style="background:var(--accent);color:#fff;border:none;border-radius:100px;
    padding:15px 34px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;">
    Sign in with Apple&nbsp;ID</button>
  <p id="signinErr" style="color:var(--accent);font-size:13px;"></p>
</div>

<div id="list" class="hidden">
  <div id="status"></div>
  <div id="buckets"></div>
</div>

<form id="add" class="hidden">
  <div class="row">
    <input id="newTitle" placeholder="Say it or type it — any language…" autocomplete="off">
    <button id="micBtn" type="button" title="Hold a thought — click, talk, click again"
      style="width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;flex:none;">🎙️</button>
    <button id="addBtn" type="submit">＋</button>
  </div>
</form>

<script src="./config.js"></script>
<script>
const ZONE = { zoneName: "com.apple.coredata.cloudkit.zone" };
const BASE = "https://api.apple-cloudkit.com/database/1/iCloud.app.todid/production/private";
let records = [];

function show(id) {
  for (const s of ["setup","signin","list"]) document.getElementById(s).classList.toggle("hidden", s!==id);
  document.getElementById("add").classList.toggle("hidden", id!=="list");
}
function session() { try { return localStorage.getItem("ckSession") || ""; } catch { return ""; } }
function api(path) {
  let u = `${BASE}/${path}?ckAPIToken=${window.TODID_CK_TOKEN}`;
  const s = session();
  if (s) u += `&ckSession=${encodeURIComponent(s)}`;
  return u;
}
async function post(path, body) {
  const r = await fetch(api(path), {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(body)});
  return { status: r.status, json: await r.json().catch(() => ({})) };
}

function bucketOf(r) {
  const due = r.fields.CD_dueAt && r.fields.CD_dueAt.value;
  if (!due) return "No date";
  const d = new Date(due), now = new Date();
  if (d < now) return "Overdue";
  const today = new Date(now); today.setHours(0,0,0,0);
  const days = Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - today)/86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Tomorrow";
  if (days <= 7) return "This week";
  return "Later";
}
function dueLabel(r) {
  const due = r.fields.CD_dueAt && r.fields.CD_dueAt.value;
  if (!due) return "";
  return new Date(due).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
function render() {
  const open = records.filter(r => !(r.fields.CD_completedAt && r.fields.CD_completedAt.value));
  const done = records.filter(r =>  (r.fields.CD_completedAt && r.fields.CD_completedAt.value));
  const order = ["Overdue","Today","Tomorrow","This week","Later","No date"];
  const groups = {};
  for (const r of open) (groups[bucketOf(r)] ??= []).push(r);
  const host = document.getElementById("buckets"); host.innerHTML = "";
  const section = (name, items) => {
    if (!items || !items.length) return;
    const h = document.createElement("h2"); h.className = "bucket";
    h.innerHTML = `${name} <span>${items.length}</span>`; host.appendChild(h);
    for (const r of items) host.appendChild(row(r));
  };
  for (const b of order) section(b, (groups[b]||[]).sort((a,c)=>(a.fields.CD_dueAt?.value??9e15)-(c.fields.CD_dueAt?.value??9e15)));
  section("Done", done.sort((a,c)=>(c.fields.CD_completedAt.value)-(a.fields.CD_completedAt.value)));
  document.getElementById("status").textContent = open.length ? "" : "Nothing to do 🎉";
}
function row(r) {
  const el = document.createElement("div");
  const completed = r.fields.CD_completedAt && r.fields.CD_completedAt.value;
  el.className = "task" + (completed ? " done" : "");
  const due = dueLabel(r);
  const overdue = r.fields.CD_dueAt?.value && r.fields.CD_dueAt.value < Date.now() && !completed;
  el.innerHTML = `<button class="check" title="${completed?"Reopen":"Complete"}"></button>
    <div class="body"><div class="title"></div>
    ${due && !completed ? `<div class="due ${overdue?"overdue":""}">${due}</div>` : ""}</div>
    <button class="del" title="Delete">🗑</button>`;
  el.querySelector(".title").textContent = r.fields.CD_title?.value ?? "(untitled)";
  el.querySelector(".check").onclick = () => toggle(r, !completed);
  el.querySelector(".del").onclick = () => del(r);
  return el;
}

async function refresh() {
  document.getElementById("status").textContent = "Loading…";
  const q = await post("records/query", { zoneID: ZONE, query: { recordType: "CD_TodoTask" }, resultsLimit: 200 });
  if (q.status !== 200) {
    document.getElementById("status").textContent =
      "Load failed: " + (q.json.reason || q.json.serverErrorCode || q.status);
    if (q.json.serverErrorCode === "AUTHENTICATION_FAILED" || q.status === 401 || q.status === 421) {
      try { localStorage.removeItem("ckSession"); } catch {}
    }
    return;
  }
  records = q.json.records || [];
  render();
}
async function toggle(r, complete) {
  const resp = await post("records/modify", { zoneID: ZONE, operations: [{ operationType: "update",
    record: { recordName: r.recordName, recordChangeTag: r.recordChangeTag, recordType: "CD_TodoTask",
              fields: { CD_completedAt: complete ? { value: Date.now() } : { value: null } } } }] });
  if (resp.status === 200) refresh(); else alert(resp.json.reason || resp.status);
}
async function del(r) {
  if (!confirm("Delete " + (r.fields.CD_title?.value || "this task") + "?")) return;
  const resp = await post("records/modify", { zoneID: ZONE, operations: [{ operationType: "forceDelete",
    record: { recordName: r.recordName } }] });
  if (resp.status === 200) refresh(); else alert(resp.json.reason || resp.status);
}
document.getElementById("add").addEventListener("submit", async e => {
  e.preventDefault();
  const text = document.getElementById("newTitle").value.trim();
  if (!text) return;
  document.getElementById("newTitle").value = "";
  capture(text, null);
});

(async function boot() {
  if (!window.TODID_CK_TOKEN) { show("setup"); return; }
  const params = new URLSearchParams(location.search);
  const fromURL = params.get("ckSession");
  if (fromURL) {
    try { localStorage.setItem("ckSession", fromURL); } catch {}
    history.replaceState(null, "", location.pathname);
  }
  if (session()) {
    const me = await fetch(api("users/current"));
    if (me.status === 200) {
      const id = await me.json();
      document.getElementById("whoami").textContent = (id.nameComponents && id.nameComponents.givenName) || "signed in";
      document.getElementById("signout").classList.remove("hidden");
      show("list"); refresh(); return;
    }
    try { localStorage.removeItem("ckSession"); } catch {}
  }
  show("signin");
  document.getElementById("signinBtn").onclick = async () => {
    const r = await fetch(api("users/current"));
    const j = await r.json().catch(() => ({}));
    if (j.redirectURL) location.href = j.redirectURL;
    else document.getElementById("signinErr").textContent = "No sign-in URL (" + r.status + ")";
  };
})();

// ---- capture through the model (same proxy the apps use) ----
const PROXY = "https://todone-capture-owi5vfwija-uc.a.run.app/v1/capture";
function deviceID() {
  try {
    let d = localStorage.getItem("todidWebDevice");
    if (!d) { d = "web-" + crypto.randomUUID(); localStorage.setItem("todidWebDevice", d); }
    return d;
  } catch { return "web-anon"; }
}
function isoNow() {
  const d = new Date(), off = -d.getTimezoneOffset();
  const p = n => String(Math.abs(n)).padStart(2, "0");
  const weekday = d.toLocaleDateString("en-US", {weekday: "long"});
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
         `${off>=0?"+":"-"}${p(Math.floor(Math.abs(off)/60))}:${p(Math.abs(off)%60)} (${weekday})`;
}
let idMap = {};
function contextBlock(utterance) {
  const open = records.filter(r => !(r.fields.CD_completedAt && r.fields.CD_completedAt.value));
  idMap = {};
  const lines = [`CURRENT_TIME: ${isoNow()}`, `TIMEZONE: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`, "OPEN_TASKS:"];
  if (!open.length) lines.push("(none)");
  open.forEach((r, i) => {
    const sid = "T" + (i+1); idMap[sid] = r;
    const due = r.fields.CD_dueAt?.value ? new Date(r.fields.CD_dueAt.value).toISOString() : "none";
    lines.push(`${sid} | ${r.fields.CD_title?.value ?? ""} | due: ${due}`);
  });
  lines.push("UTTERANCE:", utterance);
  return lines.join("\n");
}
async function capture(utterance, audioB64) {
  document.getElementById("status").textContent = "Thinking…";
  const parts = [];
  if (audioB64) parts.push({ inline_data: { mime_type: "audio/wav", data: audioB64 } });
  parts.push({ text: contextBlock(utterance || "") });
  let resp;
  try {
    const r = await fetch(PROXY, { method: "POST",
      headers: { "Content-Type": "application/json", "X-Todid-Device": deviceID() },
      body: JSON.stringify({ contents: [{ role: "user", parts }] }) });
    resp = await r.json();
    if (!r.ok) { document.getElementById("status").textContent = "Capture failed: " + (resp.message || resp.error || r.status); return; }
  } catch (e) { document.getElementById("status").textContent = "Capture failed: " + e; return; }
  let agent;
  try { agent = JSON.parse(resp.candidates[0].content.parts[0].text); }
  catch { document.getElementById("status").textContent = "Couldn't read the model's reply"; return; }
  const ops = [];
  for (const a of (agent.actions || [])) {
    if (a.type === "add_task" && a.title) {
      const fields = { CD_title: { value: a.title }, CD_id: { value: crypto.randomUUID().toUpperCase() },
                       CD_entityName: { value: "TodoTask" }, CD_createdAt: { value: Date.now() } };
      const t = a.due_at ? Date.parse(a.due_at) : NaN;
      if (!isNaN(t)) fields.CD_dueAt = { value: t };
      ops.push({ operationType: "create", record: { recordType: "CD_TodoTask", fields } });
    } else if (a.type === "complete_task") {
      for (const sid of (a.target_task_ids || [])) {
        const r = idMap[sid]; if (!r) continue;
        ops.push({ operationType: "update", record: { recordName: r.recordName, recordChangeTag: r.recordChangeTag,
          recordType: "CD_TodoTask", fields: { CD_completedAt: { value: Date.now() } } } });
      }
    } else if (a.type === "reschedule_task") {
      const t = a.due_at ? Date.parse(a.due_at) : NaN;
      for (const sid of (a.target_task_ids || [])) {
        const r = idMap[sid]; if (!r) continue;
        ops.push({ operationType: "update", record: { recordName: r.recordName, recordChangeTag: r.recordChangeTag,
          recordType: "CD_TodoTask", fields: { CD_dueAt: isNaN(t) ? { value: null } : { value: t } } } });
      }
    }
  }
  if (ops.length) {
    const w = await post("records/modify", { zoneID: ZONE, operations: ops });
    if (w.status !== 200) { document.getElementById("status").textContent = "Save failed: " + (w.json.reason || w.status); return; }
  }
  document.getElementById("status").textContent = agent.reply || "Done";
  refresh();
}

// ---- microphone: click to talk, click to send (16 kHz mono WAV, like the apps) ----
let rec = null;
async function micToggle() {
  const btn = document.getElementById("micBtn");
  if (rec) { // stop & send
    const { ctx, node, stream, chunks, rate } = rec; rec = null;
    node.disconnect(); stream.getTracks().forEach(t => t.stop()); ctx.close();
    btn.style.background = "var(--accent)"; btn.textContent = "🎙️";
    let total = 0; for (const c of chunks) total += c.length;
    if (total < 4000) { document.getElementById("status").textContent = "Too short — click, talk, click again"; return; }
    const all = new Float32Array(total); let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    const ratio = rate / 16000, n = Math.floor(all.length / ratio);
    const pcm = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      const v = all[Math.floor(i * ratio)];
      pcm[i] = Math.max(-32768, Math.min(32767, v * 32767));
    }
    const wav = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(wav);
    const ws = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
    ws(0, "RIFF"); dv.setUint32(4, 36 + pcm.length * 2, true); ws(8, "WAVEfmt ");
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true);
    dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, pcm.length * 2, true);
    new Int16Array(wav, 44).set(pcm);
    const b64 = btoa(String.fromCharCode(...new Uint8Array(wav).subarray(0, 0))) || "";
    // chunked base64 (large arrays overflow the argument list)
    const bytes = new Uint8Array(wav); let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    capture("", btoa(bin));
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const node = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    node.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(node); node.connect(ctx.destination);
    rec = { ctx, node, stream, chunks, rate: ctx.sampleRate };
    btn.style.background = "#D91E63"; btn.textContent = "⏹";
    document.getElementById("status").textContent = "Listening… click ⏹ to send";
  } catch (e) { document.getElementById("status").textContent = "Microphone blocked: " + e.name; }
}
document.getElementById("micBtn").onclick = micToggle;
document.getElementById("signout").onclick = () => {
  try { localStorage.removeItem("ckSession"); } catch {}
  location.reload();
};

</script>
</body>
</html>
