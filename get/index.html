<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get To-did</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  .get{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:22px}
  .get img{width:88px;height:88px}
  .get h1{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
  .get p{color:var(--body);font-size:17px;max-width:420px}
</style>
</head>
<body>
<main class="get">
  <img src="/icon.svg" alt="">
  <h1>Say it once.<br>It's already a <b>to-did</b>.</h1>
  <p>Free on the App Store for iPhone. 15 voice captures a month, the full list always.</p>
  <a class="btn btn-dark" id="store" href="https://apps.apple.com/us/app/to-did-voice-to-do-list/id6808734717?pt=94799512&ct=site&mt=8">Download on the App Store</a>
  <p style="font-size:14px;color:var(--faint)">Opening the App Store…</p>
</main>
<script>
  // The last path segment is Apple's campaign token, so App Store Connect can say which
  // ad each install came from. A person is sent on at once; a crawler sees this page.
  var ct = (location.pathname.replace(/\/+$/, "").split("/").pop() || "site").replace(/[^a-z0-9_-]/gi, "").slice(0, 40) || "site";
  var url = "https://apps.apple.com/us/app/to-did-voice-to-do-list/id6808734717?pt=94799512&ct=" + ct + "&mt=8";
  document.getElementById("store").href = url;
  if (!/bot|crawl|facebookexternalhit|facebot|spider/i.test(navigator.userAgent)) setTimeout(function () { location.replace(url); }, 250);
</script>
</body>
</html>
